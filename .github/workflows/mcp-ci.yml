name: MCP CI

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: "MCP authorized change ID"
        required: true
        type: string

permissions:
  contents: read

# All three jobs must pass for the workflow to succeed.
# Validation always runs across all MCP-writable surfaces regardless of which
# paths changed, so MCP cannot receive a trusted PASS if any surface fails.
# (Always-run was chosen over path-sensitive filtering to avoid fragility and
# ambiguous security behavior from caller-supplied path claims.)

jobs:
  validate-root:
    name: Root / web validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Docs validate
        run: npm run docs:validate:ci

  validate-mobile:
    name: Mobile / Expo validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Native dependency compatibility check
        run: npm run check:native-deps

      - name: TypeScript check
        run: npx tsc --noEmit

  validate-supabase:
    name: Supabase validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate SQL migration filenames and ordering
        run: node scripts/validate_migrations_ci.mjs

      - name: Type-check Supabase edge functions
        # Checks all function entrypoints and non-shared .ts files.
        # Downloads type definitions from esm.sh (read-only network; no
        # production connection, no deployment, no secrets required).
        run: |
          find supabase/functions -maxdepth 2 -name "*.ts" ! -path "*/_shared/*" \
            | sort | xargs -r deno check --no-lock
