name: Deploy Supabase Edge Functions

# ── MANUAL ONLY ──────────────────────────────────────────────────────────────
# Production Supabase Edge Function deployment. No push, PR, or automatic
# trigger. Must be invoked explicitly from the Actions tab with a confirmed
# human decision.
#
# This workflow DEPLOYS PRODUCTION SUPABASE EDGE FUNCTIONS.
# All deployments are permanent and immediately affect production users.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: >
          Type DEPLOY to confirm this deploys PRODUCTION Supabase Edge
          Functions. Any other value will abort before any deployment step.
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Edge Functions (production)
    runs-on: ubuntu-latest

    steps:
      - name: Require explicit production confirmation
        # Fail before checkout if the confirmation string is wrong.
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "ERROR: confirm_production must be exactly 'DEPLOY'."
            echo "       Received: '${{ github.event.inputs.confirm_production }}'"
            echo "       This workflow deploys PRODUCTION Supabase Edge Functions."
            echo "       Aborting."
            exit 1
          fi
          echo "Confirmation accepted. Proceeding with production deployment."

      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinning to a specific version is recommended for reproducibility.
          # Current value is 'latest' because no authoritative compatible version
          # is documented in the repository (see CI hardening result Part G).
          # Update this to a pinned version once compatibility is confirmed.
          version: latest

      - name: Deploy universal-drive-upload
        continue-on-error: true
        run: |
          supabase functions deploy universal-drive-upload \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF || 'jmdndcphkmaljhwgzqxq' }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy customer-portal-upload
        continue-on-error: true
        run: |
          supabase functions deploy customer-portal-upload \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF || 'jmdndcphkmaljhwgzqxq' }} \
