name: Build Bodyshop Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'bodyshop/**'
      - '.github/workflows/build-bodyshop-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'bodyshop/package-lock.json'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web App
        run: |
          cd bodyshop
          npm install
          npm run build
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x bodyshop/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd bodyshop/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Techwheels-Bodyshop-Debug-APK
          path: bodyshop/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
