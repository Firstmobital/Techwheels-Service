name: Build Bodyshop Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x bodyshop/android/gradlew

      - name: Build Android Debug APK
        working-directory: bodyshop/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK to root for easy access
        run: |
          mkdir -p apk-output
          cp bodyshop/android/app/build/outputs/apk/debug/app-debug.apk apk-output/Techwheels-Bodyshop-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Techwheels-Bodyshop-APK
          path: apk-output/Techwheels-Bodyshop-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: bodyshop-apk-latest
          name: 'Techwheels Bodyshop Android APK (Latest)'
          body: |
            ### 🚗 Techwheels Bodyshop & Customer Services Mobile App
            Download the standalone APK below and install on any Android phone:
            - **File**: `Techwheels-Bodyshop-v1.0.apk`
          files: apk-output/Techwheels-Bodyshop-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
