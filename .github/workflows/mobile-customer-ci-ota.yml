name: Mobile Customer App CI and OTA

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'supabase/functions/customer-portal-upload/**'
      - '.github/workflows/mobile-customer-ci-ota.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-customer-ci-ota.yml'
  workflow_dispatch:

jobs:
  validate-mobile:
    name: Validate Expo customer app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Native dependency compatibility check
        run: npm run check:native-deps

      - name: TypeScript check
        run: npx tsc --noEmit

  production-ota:
    name: Publish production OTA
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required for production OTA."
            exit 1
          fi
          npm run ota:prod:all
